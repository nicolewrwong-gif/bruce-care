name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Earlier reminders disappear when the next one for the same item arrives
        run: |
          F=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/LocalNotificationManager.java
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          a = "        createActionIntents(localNotification, mBuilder);\n"
          b = ('        try {\n'
               '            if (localNotification.getExtra() != null && localNotification.getExtra().has("timeoutMs")) {\n'
               '                long tm = localNotification.getExtra().getLong("timeoutMs");\n'
               '                if (tm > 0) mBuilder.setTimeoutAfter(tm);\n'
               '            }\n'
               '        } catch (Exception ignored) {}\n')
          if a in s and "timeoutMs" not in s:
              open(p, "w").write(s.replace(a, b + a, 1))
              print("patched")
          else:
              print("patch not applied")
          PY
          grep -n "timeoutMs" "$F" || echo "WARNING: reminders will not replace each other"

      - name: Create Android project
        run: npx cap add android

      - name: App icon (Bruce's photo)
        run: npx capacitor-assets generate --android || echo "icon generation skipped"

      - name: Notification icon and permissions
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_paw.xml android/app/src/main/res/drawable/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Fixed signing key and version number
        run: |
          G=android/app/build.gradle
          sed -i 's#^android {#android {\n    signingConfigs {\n        debug {\n            storeFile file("../../debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }#' "$G"
          sed -i 's#versionCode 1#versionCode ${{ github.run_number }}#; s#versionName "1.0"#versionName "1.${{ github.run_number }}"#' "$G"
          sed -n 1,22p "$G"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Show signing fingerprint (should be the same every build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: bruce-care-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bruce-care.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest bruce-care.apk --title "Bruce Care (latest)" --notes "Debug build $(date -u +%F)" --target "${{ github.sha }}"
