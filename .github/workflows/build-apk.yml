name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon (Bruce's photo)
        run: npx capacitor-assets generate --android || echo "icon generation skipped"

      - name: Notification icon and permissions
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_paw.xml android/app/src/main/res/drawable/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bruce-care-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bruce-care.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest bruce-care.apk --title "Bruce Care (latest)" --notes "Debug build $(date -u +%F)" --target "${{ github.sha }}"
