name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          ok=0
          for i in 1 2 3; do
            npm install && ok=1 && break
            echo "npm install failed, retrying ($i/3)..."
            sleep 20
          done
          if [ "$ok" = 0 ]; then
            echo "Falling back to install without native build scripts (icon generation may be skipped)"
            npm install --ignore-scripts
          fi
          [ -d node_modules/@capacitor/local-notifications ] || { echo "install failed"; exit 1; }

      - name: Earlier reminders disappear when the next one for the same item arrives
        run: |
          F=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/LocalNotificationManager.java
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          a = "        createActionIntents(localNotification, mBuilder);\n"
          b = ('        try {\n'
               '            if (localNotification.getExtra() != null && localNotification.getExtra().has("timeoutMs")) {\n'
               '                long tm = localNotification.getExtra().getLong("timeoutMs");\n'
               '                if (tm > 0) mBuilder.setTimeoutAfter(tm);\n'
               '            }\n'
               '        } catch (Exception ignored) {}\n')
          if a in s and "timeoutMs" not in s:
              open(p, "w").write(s.replace(a, b + a, 1))
              print("patched")
          else:
              print("patch not applied")
          PY
          grep -n "timeoutMs" "$F" || echo "WARNING: reminders will not replace each other"

      - name: Create Android project
        run: npx cap add android

      - name: App icon (Bruce's photo)
        run: |
          ok=0
          npx capacitor-assets generate --android && ok=1
          # sharp's native download is flaky: rebuild it with retries, then via a mirror
          if [ "$ok" = 0 ]; then
            for i in 1 2 3; do
              npm rebuild sharp && npx capacitor-assets generate --android && ok=1 && break
              echo "icon generation failed, retrying ($i/3)..."
              sleep 20
            done
          fi
          if [ "$ok" = 0 ]; then
            export npm_config_sharp_libvips_binary_host=https://npmmirror.com/mirrors/sharp-libvips
            npm rebuild sharp && npx capacitor-assets generate --android && ok=1
          fi
          # last resort: build the launcher icons with ImageMagick
          if [ "$ok" = 0 ]; then
            echo "Falling back to ImageMagick for the app icon"
            SRC=""
            for f in assets/icon-only.png assets/icon.png resources/icon.png resources/icon-only.png assets/logo.png; do
              [ -f "$f" ] && SRC="$f" && break
            done
            [ -n "$SRC" ] || SRC=$(ls assets/*.png resources/*.png 2>/dev/null | head -1)
            echo "Icon source: $SRC"
            if [ -n "$SRC" ]; then
              command -v convert >/dev/null || sudo apt-get install -y imagemagick
              R=android/app/src/main/res
              for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
                n=${d%%:*}; px=${d##*:}
                mkdir -p "$R/mipmap-$n"
                convert "$SRC" -resize ${px}x${px}^ -gravity center -extent ${px}x${px} "$R/mipmap-$n/ic_launcher.png"
                convert "$R/mipmap-$n/ic_launcher.png" \( -size ${px}x${px} xc:none -fill white -draw "circle $((px/2)),$((px/2)) $((px/2)),0" \) -compose DstIn -composite "$R/mipmap-$n/ic_launcher_round.png"
                cp "$R/mipmap-$n/ic_launcher.png" "$R/mipmap-$n/ic_launcher_foreground.png"
              done
              rm -rf "$R/mipmap-anydpi-v26"
            else
              echo "No icon image found, keeping the default icon"
            fi
          fi

      - name: Notification icon and permissions
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_paw.xml android/app/src/main/res/drawable/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Home screen widget
        run: |
          G=android/app/build.gradle
          PKG=$(sed -n 's/.*namespace[ =]*"\([^"]*\)".*/\1/p' "$G" | head -1)
          [ -n "$PKG" ] || PKG=$(sed -n 's/.*applicationId[ =]*"\([^"]*\)".*/\1/p' "$G" | head -1)
          echo "Package: $PKG"
          [ -n "$PKG" ] || { echo "Could not find the app package"; exit 1; }
          J=android/app/src/main/java/$(echo "$PKG" | tr . /)
          R=android/app/src/main/res
          mkdir -p "$J" "$R/layout" "$R/xml" "$R/drawable"
          for f in MainActivity BruceWidgetPlugin BruceWidgetProvider BruceUpdatePlugin BruceFileProvider BruceInstallReceiver; do
            sed "s|__PKG__|$PKG|g; s|__REPO__|$GITHUB_REPOSITORY|g" resources/widget/$f.java > "$J/$f.java"
          done
          cp resources/widget/bruce_widget.xml "$R/layout/bruce_widget.xml"
          cp resources/widget/bruce_widget_info.xml "$R/xml/bruce_widget_info.xml"
          cp resources/widget/widget_bg.xml "$R/drawable/widget_bg.xml"
          cp resources/widget/widget_btn.xml "$R/drawable/widget_btn.xml"
          cp resources/widget/update_paths.xml "$R/xml/update_paths.xml"
          # Bruce's photo for the widget header (round, 192px)
          SRC=""
          for f in assets/icon-only.png assets/icon.png resources/icon.png resources/icon-only.png assets/logo.png; do
            [ -f "$f" ] && SRC="$f" && break
          done
          [ -n "$SRC" ] || SRC=$(ls assets/*.png resources/*.png 2>/dev/null | head -1)
          echo "Widget photo source: $SRC"
          mkdir -p "$R/drawable-nodpi"
          P="$R/drawable-nodpi/bruce_photo.png"
          if [ -n "$SRC" ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            if command -v convert >/dev/null; then
              convert "$SRC" -resize 192x192^ -gravity center -extent 192x192 \( -size 192x192 xc:none -fill white -draw "circle 96,96 96,0" \) -compose DstIn -composite "$P" || rm -f "$P"
            fi
          fi
          if [ ! -f "$P" ]; then
            echo "No widget photo made, using a blank placeholder"
            python3 -c "import struct,zlib;c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('$P','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',1,1,8,6,0,0,0))+c(b'IDAT',zlib.compress(b'\x00\x00\x00\x00\x00'))+c(b'IEND',b''))"
          fi
          sed "s/__PKG__/$PKG/g" resources/widget/receiver.xml > "$RUNNER_TEMP/receiver.xml"
          python3 - android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/receiver.xml" <<'PY'
          import sys
          m, r = sys.argv[1], sys.argv[2]
          s = open(m).read()
          if "BruceWidgetProvider" not in s:
              open(m, "w").write(s.replace("</application>", open(r).read() + "    </application>", 1))
              print("receiver added")
          PY
          grep -n "BruceWidget" android/app/src/main/AndroidManifest.xml

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Fixed signing key and version number
        run: |
          G=android/app/build.gradle
          sed -i 's#^android {#android {\n    signingConfigs {\n        debug {\n            storeFile file("../../debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }#' "$G"
          sed -i 's#versionCode 1#versionCode ${{ github.run_number }}#; s#versionName "1.0"#versionName "1.${{ github.run_number }}"#' "$G"
          sed -n 1,22p "$G"

      - name: Build APK
        working-directory: android
        run: |
          # Gradle download times out after 10s by default; allow 2 minutes and use the smaller -bin package
          W=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=[0-9]*/networkTimeout=120000/; s/-all\.zip/-bin.zip/' "$W"
          grep -n "networkTimeout\|distributionUrl" "$W"
          ok=0
          for i in 1 2 3; do
            ./gradlew assembleDebug && ok=1 && break
            echo "Build failed, retrying ($i/3)..."
            sleep 20
          done
          [ "$ok" = 1 ]

      - name: Show signing fingerprint (should be the same every build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: bruce-care-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bruce-care.apk
          # The installed app reads this to learn whether a newer build exists
          echo '{"versionCode":${{ github.run_number }},"versionName":"1.${{ github.run_number }}"}' > latest.json
          gh release delete latest --cleanup-tag -y || true
          gh release create latest bruce-care.apk latest.json --title "Bruce Care (latest)" --notes "Debug build $(date -u +%F)" --target "${{ github.sha }}"
